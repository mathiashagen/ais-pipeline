# This file is included inside nginx's http block, so the two zones below are
# http-level and the server block follows.

# A short-lived cache for API answers. Every open tab asks for its area every
# 5 s; with this, any number of viewers of the same area cost api_server one
# query per few seconds, not one per viewer.
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m
                 max_size=100m inactive=1m use_temp_path=off;

# Requests per client address to /api/. A tab makes well under one per second,
# so this only stops scripts hammering the API.
limit_req_zone $binary_remote_addr zone=api_per_client:10m rate=10r/s;

server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # An area answer is ~170 KB of JSON at 60 nm and compresses to a fraction
    # of that; the coastline tiles are JSON too. nginx only compresses
    # text/html unless told otherwise.
    gzip on;
    gzip_types application/json application/geo+json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    location ~ \.geojson$ {
        types { application/geo+json geojson; }
    }

    # Behind a reverse proxy on the Docker host -- tailscale funnel, say --
    # every request reaches nginx from the Docker network's gateway, and the
    # visitor's own address is only in X-Forwarded-For. Trust that header from
    # the Docker networks and the host only, so a visitor cannot pick their
    # own address to dodge the rate limit. Direct visitors on the LAN keep
    # their real address and are unaffected.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # Docker's embedded DNS server. Looking api up here, at most 10 s old,
    # instead of once at startup means a recreated api container with a new
    # IP address is found again; nginx also starts while api is still down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        limit_req zone=api_per_client burst=20 nodelay;
        limit_req_status 429;

        # Keyed on the full original URI, query string included: two areas
        # must never share an answer.
        proxy_cache api_cache;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 3s;
        # When an answer expires, one request refreshes it while the others
        # wait for that, instead of all of them querying api_server at once.
        proxy_cache_lock on;
        proxy_cache_use_stale updating;
        add_header X-Cache-Status $upstream_cache_status always;

        # Large answers fit in memory instead of spilling to a temporary file.
        proxy_buffers 16 32k;

        # A variable in proxy_pass is what makes nginx resolve the name per
        # request. It also turns off proxy_pass's own prefix replacement, so
        # strip /api here; the query string is kept.
        set $api http://api:8080;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $api;
    }
}
