name: ais-pipeline
services:
  pipeline:
    build: .
    image: ais-pipeline
    pull_policy: build
    restart: unless-stopped
    volumes:
      - ais-data:/data
    healthcheck:
      test: ["CMD", "test", "-f", "/data/ais_data.db"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 5s

  api:
    image: ais-pipeline
    pull_policy: never
    command: ["api_server"]
    restart: unless-stopped
    depends_on:
      pipeline:
        condition: service_healthy
    volumes:
      - ais-data:/data

  web:
    build: ./web
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "8080:80"

  tunnel:
    image: cloudflare/cloudflared:2026.9.1
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    depends_on: [web]
    profiles: [tunnel]

volumes:
  ais-data: