name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    name: Windows (MSYS2 UCRT64, GCC)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      # Same toolchain and packages as the local setup in README.md.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gtest
            mingw-w64-ucrt-x86_64-asio
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-sqlite3

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        run: ctest --preset debug

  linux-sanitizers:
    # MinGW GCC ships no libasan, so the sanitizer run lives on Linux. This
    # also keeps the CMake files honest about what is Windows-specific.
    name: Linux (GCC, ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtest-dev libasio-dev nlohmann-json3-dev libsqlite3-dev

      - name: Configure
        run: cmake --preset asan

      - name: Build
        run: cmake --build --preset asan

      - name: Test
        run: ctest --preset asan

      # docker stop and systemctl stop send SIGTERM, then SIGKILL after a grace
      # period. Nothing listens on 127.0.0.1:9, so the pipeline sits in its
      # reconnect loop; it must still shut down promptly and exit 0. Under
      # ASan, a leak or use-after-free during shutdown fails this step too.
      - name: Stop cleanly on SIGTERM
        run: |
          ./build/asan/src/app/kystverket_pipeline 127.0.0.1 9 "$RUNNER_TEMP/sigterm.db" &
          pid=$!
          sleep 3

          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::pipeline exited before SIGTERM was sent"
            wait "$pid" || true
            exit 1
          fi

          kill -TERM "$pid"
          if ! timeout 10 tail --pid="$pid" -f /dev/null; then
            echo "::error::pipeline still running 10 s after SIGTERM"
            kill -KILL "$pid"
            exit 1
          fi

          status=0
          wait "$pid" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::pipeline exited with status $status after SIGTERM (143 means the signal killed it)"
            exit 1
          fi
          echo "pipeline stopped cleanly on SIGTERM"

      # Same check for api_server, which blocks in httplib's accept loop rather
      # than a loop of its own. It must answer a request first, so the stop is
      # tested on a server that is really serving. It reads the database the
      # previous step left behind: the pipeline creates the schema at startup.
      - name: Stop api_server cleanly on SIGTERM
        run: |
          db="$RUNNER_TEMP/sigterm.db"
          if [ ! -f "$db" ]; then
            echo "::error::$db missing; the pipeline SIGTERM step should have created it"
            exit 1
          fi

          ./build/asan/src/api_server/api_server "$db" 18080 &
          pid=$!

          serving=false
          for _ in $(seq 1 20); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::api_server exited before it served a request"
              wait "$pid" || true
              exit 1
            fi
            if curl -sf http://127.0.0.1:18080/positions > /dev/null; then
              serving=true
              break
            fi
            sleep 0.5
          done
          if [ "$serving" != true ]; then
            echo "::error::api_server did not answer /positions within 10 s"
            kill -KILL "$pid"
            exit 1
          fi

          kill -TERM "$pid"
          if ! timeout 10 tail --pid="$pid" -f /dev/null; then
            echo "::error::api_server still running 10 s after SIGTERM"
            kill -KILL "$pid"
            exit 1
          fi

          status=0
          wait "$pid" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::api_server exited with status $status after SIGTERM (143 means the signal killed it)"
            exit 1
          fi
          echo "api_server stopped cleanly on SIGTERM"

  web:
    name: Web (Vite + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
